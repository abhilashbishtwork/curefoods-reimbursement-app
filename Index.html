          showToast(err.message || 'Failed to send.');
          btn.disabled = false; btn.textContent = 'Email Report';
        });
      });
    }).catch(function (err) { statsBody.innerHTML = '<div class="empty-state">' + (err.message || 'Failed to load.') + '</div>'; });
  }

  // ---------- Finance ----------
  /** Compact row for Finance: person | category | amount | approved by (manager name) — per Finance's request for a leaner view than the full claim card. */
  function financeRowHtml(c, opts) {
    opts = opts || {};
    var checkbox = opts.checkbox ? '<span class="claim-check"><input type="checkbox" class="claim-select" data-id="' + c['Claim ID'] + '"></span>' : '';
    var dateStr = c['Expense Date'] ? new Date(c['Expense Date']).toLocaleDateString('en-IN') : '';
    return (
      '<div class="card finance-row" data-claim-id="' + c['Claim ID'] + '">' +
        '<div class="finance-row-top">' +
          checkbox +
          '<div class="finance-row-main">' +
            '<div class="finance-row-person">' + escapeHtml(c['Employee Name'] || '') + '</div>' +
            '<div class="finance-row-meta">' + escapeHtml(c['Category'] || '') + (dateStr ? ' &middot; ' + dateStr : '') +
              ' &middot; Approved by ' + escapeHtml(c['Manager Name'] || c['Manager Email'] || '') + '</div>' +
          '</div>' +
          '<div class="claim-amount">₹' + Number(c['Amount']).toLocaleString('en-IN') + '</div>' +
        '</div>' +
        (c['Receipt URL'] ? '<div class="claim-receipt">' +
          c['Receipt URL'].split('|').map(function (u, i, arr) {
            var safeUrl = safeReceiptUrl_(u);
            return safeUrl ? '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">View bill' + (arr.length > 1 ? ' ' + (i + 1) : '') + '</a>' : '';
          }).filter(Boolean).join(' &nbsp;·&nbsp; ') +
        '</div>' : '') +
        (opts.extraHtml || '') +
      '</div>'
    );
  }

  function renderFinancePortal(content) {
    var sub = state.activeSubtab.finance || 'queue';
    content.innerHTML =
      subtabsHtml([
        { key: 'queue', label: 'Payment Queue' },
        { key: 'held', label: 'Held' },
        { key: 'history', label: 'Paid' },
        { key: 'dashboard', label: 'Dashboard' }
      ], sub) +
      '<div id="finance-body"></div>';
    wireSubtabs(content, function (key) { state.activeSubtab.finance = key; state.selectedFinance = {}; renderPortal(); });
    var body = document.getElementById('finance-body');
    if (sub === 'dashboard') { renderAdminDashboard(body); return; }
    var fn = sub === 'queue' ? 'handleListFinanceQueue' : sub === 'held' ? 'handleListFinanceHeld' : 'handleListFinanceHistory';
    callServer(fn, []).then(function (res) {
      var exportBar = sub !== 'held' ? '<div class="btn-row"><button class="btn-outline btn-small" id="export-csv">Export CSV</button></div>' : '';
      if (!res.claims.length) { body.innerHTML = exportBar + '<div class="empty-state">Nothing here.</div>'; wireExport(sub, body); return; }
      body.innerHTML = exportBar + res.claims.map(function (c) {
        var actions = '';
        if (sub === 'queue') {
          actions =
            '<div class="finance-row-utr"><input class="txn-input" data-id="' + c['Claim ID'] + '" placeholder="UTR (optional)"></div>' +
            '<div class="btn-row">' +
              '<button class="btn-outline btn-small btn-hold" data-id="' + c['Claim ID'] + '">Hold</button>' +
              '<button class="btn-outline btn-small btn-return-admin" data-id="' + c['Claim ID'] + '">Return to Admin</button>' +
            '</div>';
        } else if (sub === 'held') {
          actions =
            (c['Return Reason'] ? '<div class="claim-remarks">Hold reason: ' + escapeHtml(c['Return Reason']) + '</div>' : '') +
            '<div class="finance-row-utr"><input class="txn-input" data-id="' + c['Claim ID'] + '" placeholder="UTR (optional)"></div>' +
            '<div class="btn-row"><button class="btn-outline btn-small btn-release" data-id="' + c['Claim ID'] + '">Release</button></div>';
        }
        return financeRowHtml(c, { checkbox: sub === 'queue', extraHtml: actions });
      }).join('') + (sub === 'queue' ? renderFinanceBulkBarHtml() : '');
      if (sub === 'queue') wireFinanceQueue(body);
      if (sub === 'held') wireFinanceHeld(body);
      wireExport(sub, body);
    }).catch(function (err) { body.innerHTML = '<div class="empty-state">' + (err.message || 'Failed to load.') + '</div>'; });
  }

  function renderFinanceBulkBarHtml() {
    return '<div class="bulk-bar"><label>Shared UTR for selected claims (if available)</label>' +
      '<input id="bulk-txn-ref" placeholder="e.g. UTR12345 — leave blank if not available">' +
      '<button class="btn-primary" id="bulk-mark-paid">Mark selected as Paid</button></div>';
  }

  function wireFinanceQueue(body) {
    body.querySelectorAll('.claim-select').forEach(function (cb) {
      cb.addEventListener('change', function () {
        state.selectedFinance[cb.getAttribute('data-id')] = cb.checked;
      });
    });
    var bulkBtn = document.getElementById('bulk-mark-paid');
    if (bulkBtn) {
      bulkBtn.addEventListener('click', function () {
        var selectedIds = Object.keys(state.selectedFinance).filter(function (id) { return state.selectedFinance[id]; });
        var ref = document.getElementById('bulk-txn-ref').value.trim();
        if (!selectedIds.length) { showToast('Select at least one claim.'); return; }
        bulkBtn.disabled = true; bulkBtn.textContent = 'Processing…';
        callServer('handleBulkMarkPaid', [{ claimIds: selectedIds, transactionRef: ref }]).then(function (res) {
          playDone();
          showToast(res.paidCount + ' claims marked paid.');
          state.selectedFinance = {};
          renderPortal();
        }).catch(function (err) { showToast(err.message || 'Failed.'); bulkBtn.disabled = false; bulkBtn.textContent = 'Mark selected as Paid'; });
      });
    }
    body.querySelectorAll('.txn-input').forEach(function (input) {
      var wrapper = input.parentElement;
      var singleBtn = el('<button class="btn-primary btn-small" style="margin-top:8px">Mark Paid (this claim only)</button>');
      wrapper.appendChild(singleBtn);
      singleBtn.addEventListener('click', function () {
        var id = input.getAttribute('data-id');
        singleBtn.disabled = true;
        callServer('handleMarkPaid', [{ claimId: id, transactionRef: input.value.trim() }]).then(function () {
          playDone();
          showToast('Marked as paid.');
          renderPortal();
        }).catch(function (err) { showToast(err.message || 'Failed.'); singleBtn.disabled = false; });
      });
    });
    body.querySelectorAll('.btn-hold').forEach(function (btn) {
      btn.addEventListener('click', function () {
        askRemarks('Reason for hold', function (remarks) {
          btn.disabled = true;
          callServer('handleFinanceHold', [{ claimId: btn.getAttribute('data-id'), remarks: remarks }]).then(function () {
            playDone();
            showToast('Claim put on hold.');
            renderPortal();
          }).catch(function (err) { showToast(err.message || 'Failed.'); btn.disabled = false; });
        }, { submitLabel: 'Hold' });
      });
    });
    body.querySelectorAll('.btn-return-admin').forEach(function (btn) {
      btn.addEventListener('click', function () {
        askRemarks('Reason for returning to Admin', function (remarks) {
          btn.disabled = true;
          callServer('handleFinanceReturnToAdmin', [{ claimId: btn.getAttribute('data-id'), remarks: remarks }]).then(function () {
            playDone();
            showToast('Sent back to Admin.');
            renderPortal();
          }).catch(function (err) { showToast(err.message || 'Failed.'); btn.disabled = false; });
        }, { submitLabel: 'Send' });
      });
    });
  }

  function wireFinanceHeld(body) {
    body.querySelectorAll('.btn-release').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.disabled = true;
        callServer('handleFinanceReleaseHold', [{ claimId: btn.getAttribute('data-id') }]).then(function () {
          playDone();
          showToast('Released back to Payment Queue.');
          renderPortal();
        }).catch(function (err) { showToast(err.message || 'Failed.'); btn.disabled = false; });
      });
    });
    body.querySelectorAll('.txn-input').forEach(function (input) {
      var wrapper = input.parentElement;
      var singleBtn = el('<button class="btn-primary btn-small" style="margin-top:8px">Mark Paid</button>');
      wrapper.appendChild(singleBtn);
      singleBtn.addEventListener('click', function () {
        var id = input.getAttribute('data-id');
        singleBtn.disabled = true;
        callServer('handleMarkPaid', [{ claimId: id, transactionRef: input.value.trim() }]).then(function () {
          playDone();
          showToast('Marked as paid.');
          renderPortal();
        }).catch(function (err) { showToast(err.message || 'Failed.'); singleBtn.disabled = false; });
      });
    });
  }

  function wireExport(sub, body) {
    var btn = document.getElementById('export-csv');
    if (!btn) return;
    btn.addEventListener('click', function () {
      btn.disabled = true;
      callServer('handleExportFinanceCsv', [{ scope: sub === 'history' ? 'history' : 'queue' }]).then(function (res) {
        downloadCsv(res.csv, 'reimbursement-' + sub + '.csv');
        btn.disabled = false;
      }).catch(function (err) { showToast(err.message || 'Export failed.'); btn.disabled = false; });
    });
  }

  function policyStepHtml(num, title, body) {
    return '<div class="policy-step"><div class="num">' + num + '</div><div class="body"><b>' + title + '</b><span>' + body + '</span></div></div>';
  }

  function renderPolicyPortal(content) {
    content.innerHTML = '<div class="policy-hero"><h2>Reimbursement &amp; Travel Policy</h2><p>Loading your rates…</p></div>';
    callServer('handleGetMyTravelRates', []).then(function (r) {
      renderPolicyPortalWithRates_(content, r);
    }).catch(function (err) {
      content.innerHTML = '<div class="policy-hero"><h2>Reimbursement &amp; Travel Policy</h2><p>' + escapeHtml(err.message || 'Could not load your rates.') + '</p></div>';
    });
  }

  function renderPolicyPortalWithRates_(content, r) {
    var billsRequired = r.billsRequiredHotel && !/no\s*—?\s*flat allowance/i.test(r.billsRequiredHotel);
    var heroHtml =
      '<div class="policy-hero">' +
        '<h2>Reimbursement &amp; Travel Policy</h2>' +
        '<p>What you can claim, at a glance — pulled live from the Travel policy sheet for your company and grade.</p>' +
        '<span class="tag">Live policy · updates automatically when the sheet changes</span>' +
      '</div>';
    var myRatesHtml =
      '<div class="card">' +
        '<div class="policy-tier-grid">' +
          '<div class="policy-stat"><div class="lab">Local Conveyance (2-Wheeler)</div><div class="val">' + escapeHtml(r.conveyance2Wheeler || 'Not defined') + '</div></div>' +
          '<div class="policy-stat"><div class="lab">Local Conveyance (4-Wheeler)</div><div class="val">' + escapeHtml(r.conveyance4Wheeler || 'Not defined') + '</div></div>' +
          '<div class="policy-stat"><div class="lab">Monthly Conveyance Cap</div><div class="val">' + (r.monthlyCap !== null && r.monthlyCap !== undefined ? '₹' + Number(r.monthlyCap).toLocaleString('en-IN') + '/month' : 'Not defined') + '</div></div>' +
          '<div class="policy-stat"><div class="lab">Hotel</div><div class="val">' + escapeHtml(r.hotelRate || 'Not defined for your grade') + '</div></div>' +
          '<div class="policy-stat"><div class="lab">Food DA</div><div class="val">' + escapeHtml(r.foodDaRate || 'Not defined for your grade') + '</div></div>' +
          '<div class="policy-stat"><div class="lab">Flight Eligible</div><div class="val">' + escapeHtml(r.flightEligible || 'Not defined') + '</div></div>' +
        '</div>' +
        '<div class="policy-tier-note">Hotel bills ' + (billsRequired ? 'are required' : 'are not required — flat allowance') + ' for ' + escapeHtml(r.brand || 'your company') + '. These rates come straight from the live Travel policy sheet, so they’re always current.</div>' +
      '</div>' +

      '<div class="policy-section-title">How to claim a reimbursement</div>' +
      '<div class="card">' +
        '<div class="policy-steps">' +
          policyStepHtml(1, 'Submit within 30 days', 'Claims filed after 30 days of travel need extra sign-off from your Head of Department.') +
          policyStepHtml(2, 'Email your manager', 'Kick off the process with an email to your reporting manager.') +
          policyStepHtml(3, 'Submit form + receipts', 'Once your manager approves, send the reimbursement form and original receipts to the accounts team.') +
          policyStepHtml(4, 'Operations Head approval', 'The accounts team routes it to the Operations Head for sign-off.') +
          policyStepHtml(5, 'Uploaded to Oracle', 'The verified invoice (with company name on it) is uploaded to the Oracle portal.') +
          policyStepHtml(6, 'Paid within 15 working days', 'Payment is released within 15 working days of the Oracle upload.') +
        '</div>' +
      '</div>' +

      '<div class="policy-section-title">Booking your travel</div>' +
      '<div class="card">' +
        '<div class="policy-steps">' +
          policyStepHtml(1, 'Notify 10 days in advance', 'Required for any travel of 500km or more, in either direction.') +
          policyStepHtml(2, 'Log personal vehicle KMs', 'If you use your own vehicle, record the exact kilometers in the claim and get your manager’s approval.') +
          policyStepHtml(3, 'Book via MakeMyTrip or Yatra', 'Use one of these apps and stay within your band’s budget.') +
        '</div>' +
      '</div>' +

      '<div class="policy-section-title">Approval policy for financial transactions</div>' +
      '<div class="card">' +
        '<p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5;">A clear, transparent process for approving any financial transaction — ensuring company funds are used accurately and with the right authorization.</p>' +
        '<div class="policy-role-grid">' +
          '<div class="policy-role-card"><div class="ico icon-navy">R</div><b>Requester</b><span>Initiates the request</span></div>' +
          '<div class="policy-role-card"><div class="ico icon-blue">A</div><b>Approver</b><span>Authorizes or rejects it</span></div>' +
          '<div class="policy-role-card"><div class="ico icon-gold">F</div><b>Finance Team</b><span>Verifies &amp; processes it</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="accordion" id="acc-process">' +
        '<div class="accordion-head"><span>Approval process, step by step</span><span class="chev">▾</span></div>' +
        '<div class="accordion-body">' +
          '<div class="policy-steps">' +
            policyStepHtml(1, 'Requester submits', 'A request goes in with supporting documentation.') +
            policyStepHtml(2, 'Approver reviews', 'The manager reviews and verifies the request.') +
            policyStepHtml(3, 'Approver decides', 'It’s approved or rejected — with reasons either way.') +
            policyStepHtml(4, 'Finance processes', 'Approved requests are processed and paid out by the Finance Team.') +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="policy-note">' +
        '<b>Thresholds:</b> Your manager approves within defined limits. Anything likely to cross the threshold needs sign-off from the departmental head, then a final cross-check from Finance.' +
      '</div>' +
      '<div class="policy-note pink">' +
        '<b>Exceptions:</b> Urgent transactions can be approved directly by the CEO or Finance Director, with documentation filed afterward. Recurring transactions may be pre-approved fortnightly with periodic review.' +
      '</div>' +

      '<div class="policy-tier-note" style="text-align:center;margin:16px 2px 4px;">Rates above are read live from the Travel policy sheet — edit that sheet and this page reflects it immediately.</div>';

    content.innerHTML = heroHtml + myRatesHtml;

    content.querySelectorAll('.accordion-head').forEach(function (head) {
      head.addEventListener('click', function () {
        head.parentElement.classList.toggle('open');
      });
    });
  }

  boot();
</script>
